<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>جرد العربيات · Car Check</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Tahoma,Arial;background:#f3f4f6;color:#111}
header{background:#1e3a8a;color:#fff;padding:12px 14px;font-weight:700;display:flex;justify-content:space-between}
main{max-width:760px;margin:auto;padding:10px}section{background:#fff;border-radius:10px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px #0002}
h3{margin:0 0 8px;font-size:16px}button{font:inherit;padding:10px 14px;border:0;border-radius:8px;background:#1e3a8a;color:#fff;margin:3px;cursor:pointer}
button.g{background:#e5e7eb;color:#111}button.r{background:#b91c1c}button.ok{background:#15803d}
input[type=text]{width:100%;font:inherit;font-size:20px;padding:10px;border:1px solid #9ca3af;border-radius:8px;text-align:center}
.cam{position:relative}video{width:100%;background:#000;border-radius:8px;min-height:120px}
.guide{position:absolute;left:10%;top:35%;width:80%;height:30%;border:3px solid #22c55e;border-radius:6px;pointer-events:none}
.kb{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:8px;direction:rtl}
.kb button{background:#e5e7eb;color:#111;min-width:40px;padding:9px 6px;font-size:18px;margin:0}
.cand{display:flex;justify-content:space-between;align-items:center;border:1px solid #d1d5db;border-radius:8px;padding:8px;margin:5px 0}
.cand b{font-size:18px;direction:rtl}.small{color:#555;font-size:13px}
table{border-collapse:collapse;width:100%}td,th{border:1px solid #999;padding:5px 7px;text-align:right;vertical-align:top;font-size:13px}
th{background:#e5e7eb}td.l{width:34%;background:#f3f4f6;font-weight:700}
.toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:20px;display:none;z-index:9}
#pa{display:none}
.y{background:#fde047;color:#000}.rd{background:#dc2626;color:#fff}
#pa,#pa *{-webkit-print-color-adjust:exact;print-color-adjust:exact}#pa .rd small{color:#fff}
.hd{border:2px solid #1e3a8a;border-radius:6px;padding:4px;margin-bottom:6px;text-align:center}.hp{font-size:16px;font-weight:800;direction:rtl}.hr{display:inline-block;margin:2px 8px 0}.hr b{font-size:11px}
#pa .k{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}#pa .k .c{border:2px solid #000;padding:3px 8px;text-align:center}#pa .k b{font-size:13px}
#pa .f{font-size:15px;direction:rtl}#pa .ph{font-size:19px;font-weight:800;text-align:center;border:2px solid #000;padding:3px;margin-bottom:3px}
#pa .sub{text-align:center;color:#555;margin-bottom:12px}#pa .g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#pa .c{border:1px solid #888;padding:7px 10px}#pa small{display:block;color:#555;font-size:12px}#pa .c b{font-size:17px}
#pa .nb{border:1px solid #888;padding:10px;margin-top:10px;white-space:pre-wrap;line-height:1.8;font-size:15px}
@media print{body>*:not(#pa){display:none!important}#pa{display:block}body{background:#fff}h2{margin:0 0 6px}.pb{page-break-before:always}}
</style></head><body>
<header><span>🚗 جرد العربيات · Car Check</span><span id="st" class="small" style="color:#bfdbfe"></span></header>
<main>
<section><h3>1) الشيت · Sheet (xlsx / csv)</h3>
<input type="file" id="f" accept=".xlsx,.xls,.csv"><div id="sinfo" class="small"></div></section>

<section><h3>2) الكاميرا · Camera</h3>
<div class="cam"><video id="v" playsinline muted></video><div class="guide"></div></div>
<div class="small">ضع اللوحة داخل الإطار الأخضر · Put the plate inside the green box</div>
<button id="bcam">تشغيل الكاميرا · Start</button><button id="bshot" class="ok">📷 التقط · Capture</button>
<div id="ocr" class="small"></div></section>

<section><h3>3) كتابة / تصحيح · Type / Fix</h3>
<input type="text" id="q" placeholder="ف ك ع 9187" autocomplete="off">
<div class="kb" id="kb"></div><div id="cands"></div></section>

<section id="repS" style="display:none"><h3>تقرير السيارة · Car Report</h3><div id="rep"></div>
<button id="pr1">🖨️ PDF</button><button id="wa1" class="ok">📲 واتساب</button></section>

<section><h3>4) الجرد · Inventory (<span id="cnt">0</span>)</h3><div id="list"></div>
<button id="bx" class="ok">⬇️ Excel</button><button id="bp">🖨️ PDF</button><button id="wa2" class="ok">📲 واتساب</button><button id="bc" class="r">مسح الكل · Clear</button></section>
</main>
<style id="pg"></style><div id="pa"></div><div class="toast" id="t"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js" crossorigin="anonymous"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const F=[['incident','INCIDENT_NUMBER','رقم أمر الشغل','Work Order'],['date','RECEPTION_DATE','تاريخ الاستلام','Reception Date'],['model','MODEL','موديل السيارة','Model'],['vin','LOT_NUMBER','رقم الشاسيه','Chassis'],['advisor','SERVICE_ADVISOR','مهندس الاستقبال','Service Advisor'],['leader','TEAM_LEADER','تيم ليدر','Team Leader'],['status','JOB_STATUS','حالة أمر الشغل','Job Status'],['notes','NOTES','ملاحظات','']];
const SHOWQ=false; // true = إظهار عدد القطع بالفرع والشركة
const PALL=[['item','ITEM_DESC','القطعة','Part'],['sod','SALES_ORDER_DATE','تاريخ طلب القطعة','Order Date'],['eta','ETA','تاريخ متوقع وصول القطعة','ETA'],['ps','PART_STATUS','حالة القطعة','Part Status'],['aq','AVAILABLE_QTY','المتاح بالفرع','Branch Qty',1],['oq','ORG_QTY','المتاح بالشركة','Company Qty',1],['sms','SMS_SENT','SMS_SENT',''],['smsd','SMS_DATE','SMS_DATE',''],['vor','VOR_FLAG_DATE','VOR_FLAG_DATE','']];
const P=PALL.filter(x=>SHOWQ||!x[4]),DT=new Set(['sod','eta','smsd','vor']);
const PL=['رقم اللوحة','Plate'];
let db={},cap=[],cur=null;
// storage
const idb=new Promise((res,rej)=>{const r=indexedDB.open('cars',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>res(r.result);r.onerror=rej});
const put=async(k,v)=>{const d=await idb;d.transaction('k','readwrite').objectStore('k').put(v,k)};
const get=async k=>{const d=await idb;return new Promise(r=>{const q=d.transaction('k').objectStore('k').get(k);q.onsuccess=()=>r(q.result)})};
const toast=m=>{const t=$('t');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200)};
// plate helpers
const AD='٠١٢٣٤٥٦٧٨٩';
const norm=s=>String(s||'').replace(/[٠-٩]/g,d=>AD.indexOf(d)).replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[^0-9\u0621-\u064A]/g,'');
const show=k=>k.replace(/\d/g,'').split('').join(' ')+' '+k.replace(/\D/g,'');
function lev(a,b){const m=[...Array(a.length+1)].map((_,i)=>[i]);for(let j=1;j<=b.length;j++)m[0][j]=j;
for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]==b[j-1]?0:1));return m[a.length][b.length]}
function cands(q,n){const qd=q.replace(/\D/g,''),ql=q.replace(/\d/g,'');
return Object.keys(db).map(k=>({k,s:lev(qd,k.replace(/\D/g,''))*2+lev(ql,k.replace(/[0-9]/g,''))})).sort((a,b)=>a.s-b.s).slice(0,n)}
// sheet
const hn=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const MO=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
function fd(s){s=String(s);let m=s.match(/^(\d{1,2})[-\s]([A-Za-z]{3})[a-z]*[-\s](\d{2,4})/);if(m){const mo=MO.indexOf(m[2].toLowerCase());if(mo<0)return s;let y=+m[3];if(y<100)y+=2000;return `${+m[1]}/${mo+1}/${y}`}
m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);return m?`${+m[1]}/${+m[2]}/${m[3]}`:s}
function readRows(wb){const seen=[];for(const n of wb.SheetNames){
const a=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false,defval:''});
for(let i=0;i<Math.min(a.length,30);i++){const h=a[i].map(hn),pi=h.findIndex(x=>x.startsWith('PLATE'));
if(pi>=0)return a.slice(i+1).map(r=>{const o={__p:r[pi]};h.forEach((k,j)=>{if(k&&!(k in o))o[k]=r[j]});return o});
if(i<2)seen.push(a[i].slice(0,6).join(','))}}
throw new Error('عمود PLATE_NUMBER غير موجود / not found. Saw: '+seen.join(' // '))}
function build(rows){const g={};
for(const r of rows){const k=norm(r.__p);if(!k)continue;const inc=String(r.INCIDENTNUMBER??'').trim();((g[k]??={})[inc]??=[]).push(r)}
const dv=r=>{const m=fd(String(r.RECEPTIONDATE??'').trim()).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);return m?(+m[3])*1e4+(+m[2])*100+(+m[1]):0};
const o={};
for(const [k,incs] of Object.entries(g)){const ids=Object.keys(incs);let best=ids[0],bv=-1;
for(const id of ids){const v=Math.max(...incs[id].map(dv));if(v>=bv){bv=v;best=id}}
const c=o[k]={plate:String(incs[best][0].__p).trim(),_s:{},_p:new Map(),others:ids.filter(i=>i&&i!==best)};
for(const r of incs[best]){
for(const [f,col] of F){let v=String(r[hn(col)]??'').trim();if(col==='SERVICE_ADVISOR')v=v.replace(/\s*\(.*?\)\s*/g,' ').trim();
if(f==='date')v=fd(v);if(v)(c._s[f]??=new Set()).add(v)}
const vor=fd(String(r.VORFLAGDATE??'').trim());
if(/\d/.test(vor)){const q={};for(const x of PALL){let v=String(r[hn(x[1])]??'').trim();if(DT.has(x[0]))v=fd(v);q[x[0]]=v}c._p.set(JSON.stringify(q),q)}}
for(const f in c._s)c[f]=f==='date'?[...c._s[f]][0]:[...c._s[f]].join(' | ');c.parts=[...c._p.values()];delete c._s;delete c._p}
return o}
$('f').onchange=async e=>{const file=e.target.files[0];if(!file)return;
try{const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
const rows=readRows(wb);
db=build(rows);if(!Object.keys(db).length)return alert('لم أجد أي لوحات في الملف · No plates found');
await put('db',db);info()}catch(x){alert('خطأ في قراءة الملف · '+x.message)}};
const info=()=>$('sinfo').textContent=`✔ ${Object.keys(db).length} سيارة / cars (${Object.keys(db).length?'جاهز':''})`;
// OCR
let wk;async function worker(){if(!wk){wk=await Tesseract.createWorker(['ara','eng']);await wk.setParameters({tessedit_pageseg_mode:'6'})}return wk}
let stream;
$('bcam').onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920}},audio:false});
$('v').srcObject=stream;await $('v').play()}catch(e){alert('تعذر تشغيل الكاميرا · Camera error: '+e.message)}};
$('bshot').onclick=async()=>{const v=$('v');if(!v.videoWidth)return toast('شغل الكاميرا أولا');
const sw=v.videoWidth*.8,sh=v.videoHeight*.3,c=document.createElement('canvas');c.width=900;c.height=Math.round(900*sh/sw);
const x=c.getContext('2d');x.drawImage(v,v.videoWidth*.1,v.videoHeight*.35,sw,sh,0,0,c.width,c.height);
const im=x.getImageData(0,0,c.width,c.height),d=im.data;
for(let i=0;i<d.length;i+=4){let g=.3*d[i]+.59*d[i+1]+.11*d[i+2];g=Math.max(0,Math.min(255,(g-128)*1.6+128));d[i]=d[i+1]=d[i+2]=g}
x.putImageData(im,0,0);$('ocr').textContent='⏳ جاري القراءة... Reading...';
try{const w=await worker();const r=await w.recognize(c);const k=norm(r.data.text);
$('ocr').textContent='قرأت · Read: '+(k?show(k):'—');$('q').value=k?show(k):'';suggest()}catch(e){$('ocr').textContent='OCR error: '+e.message}};
// manual
const kb=$('kb');'ا ب ج د ر س ص ط ع ف ق ك ل م ن ه و ي 1 2 3 4 5 6 7 8 9 0 ⌫'.split(' ').forEach(ch=>{const b=document.createElement('button');b.textContent=ch;
b.onclick=()=>{const q=$('q');q.value=ch==='⌫'?q.value.slice(0,-1):q.value+ch;suggest()};kb.appendChild(b)});
$('q').oninput=suggest;
function suggest(){const k=norm($('q').value),box=$('cands');box.innerHTML='';if(!k)return;
(db[k]?[{k}]:cands(k,Object.keys(db).length?3:0)).forEach(({k:ck})=>{const o=db[ck],d=document.createElement('div');d.className='cand';
d.innerHTML=`<div><b>${esc(show(ck))}</b><div class="small">${esc(o.model||'')} · ${esc(o.incident||'')}</div></div>`;
const b=document.createElement('button');b.className='ok';b.textContent='✔ اختيار';b.onclick=()=>add(ck,true);d.appendChild(b);box.appendChild(d)});
if(!db[k]){const u=document.createElement('button');u.className='g';u.textContent=`➕ "${show(k)}" غير موجودة في الشيت · not in sheet`;u.onclick=()=>add(k,false);box.appendChild(u)}}
function add(k,found){if(cap.some(c=>c.key===k))toast('مكررة - تم تجاهلها · Duplicate');else{cap.push({key:k,found,t:Date.now()});put('cap',cap);toast('✔ تمت الإضافة')}
cur=db[k]?k:null;render();$('q').value='';$('cands').innerHTML='';$('ocr').textContent=''}
// report
const oth=k=>{const x=(db[k]||{}).others||[];return x.length?'⚠️ للعربية أوامر شغل أخرى أقدم: '+x.join(' , ')+' — المعروض هو الأحدث':''};
const lb=l=>l[1]?l[0]+' · '+l[1]:l[0];
const today=()=>{const d=new Date();return `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`};
function age(k){const m=String((db[k]||{}).date||'').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(!m)return null;const t=new Date();
const n=Math.round((new Date(t.getFullYear(),t.getMonth(),t.getDate())-new Date(+m[3],m[2]-1,+m[1]))/864e5);
return {n,c:n>30?'rd':n>15?'y':'',i:n>30?'🔴':n>15?'🟡':''}}
const ageTxt=k=>{const a=age(k);return a?`${a.i?a.i+' ':''}${a.n} يوم`:'—'};
const head=k=>{const o=db[k];return `<div class="hd"><div class="hp">${esc(show(k))}</div><div class="hr"><b>${esc(o.advisor||'—')}</b></div><div class="hr"><b>${esc(o.model||'—')}</b></div></div>`};
const rowsOf=k=>{const o=db[k],a=age(k),r=[];
F.filter(x=>!['advisor','model'].includes(x[0])).forEach(x=>{r.push([[x[2],x[3]],o[x[0]]||'—','']);if(x[0]==='date')r.push([['مدة الانتظار','Days'],ageTxt(k),a?a.c:''])});return r};
const partsScreen=k=>{const ps=db[k].parts||[];if(!ps.length)return '';
return '<h3 style="margin:12px 0 6px">🔧 قطع الغيار · Parts</h3>'+ps.map(p=>'<table style="margin-bottom:8px">'+P.map(x=>`<tr><td class="l">${esc(lb([x[2],x[3]]))}</td><td>${esc(p[x[0]]||'—')}</td></tr>`).join('')+'</table>').join('')};
function render(){$('cnt').textContent=cap.length;const L=$('list');L.innerHTML='';
cap.forEach((c,i)=>{const o=db[c.key]||{},d=document.createElement('div');d.className='cand';
d.innerHTML=`<div><b>${esc(show(c.key))}</b><div class="small">${db[c.key]?esc((o.model||'')+' · '+(o.status||'')+' · '+ageTxt(c.key)):'⚠️ غير موجودة في الشيت · Not in sheet'}</div></div>`;
const v=document.createElement('button');v.className='g';v.textContent='👁';v.onclick=()=>{cur=db[c.key]?c.key:null;render();scrollTo(0,$('repS').offsetTop)};
const x=document.createElement('button');x.className='r';x.textContent='✕';x.onclick=()=>{cap.splice(i,1);put('cap',cap);if(cur===c.key)cur=null;render()};
d.append(v,x);L.appendChild(d)});
$('repS').style.display=cur&&db[cur]?'block':'none';
if(cur&&db[cur])$('rep').innerHTML=head(cur)+(oth(cur)?'<div class="y" style="padding:6px;border-radius:6px;margin-bottom:6px">'+esc(oth(cur))+'</div>':'')+'<table>'+rowsOf(cur).map(([l,v,c])=>`<tr><td class="l">${esc(lb(l))}</td><td class="${c}">${esc(v)}</td></tr>`).join('')+'</table>'+partsScreen(cur)}
// print + share
function doPrint(h,land){$('pg').textContent=`@page{size:A4 ${land?'landscape':'portrait'};margin:10mm}`;$('pa').innerHTML=h;window.print()}
async function share(t){const u='https://wa.me/?text='+encodeURIComponent(t);
if(u.length<5000){window.open(u,'_blank');return}
if(navigator.share){try{await navigator.share({text:t});return}catch(e){if(e.name==='AbortError')return}}
try{await navigator.clipboard.writeText(t);toast('تم نسخ النص - الصقه في واتساب')}catch(e){prompt('انسخ النص والصقه في واتساب',t)}
window.open('https://wa.me/','_blank')}
const ptab=ps=>`<h3>🔧 قطع الغيار</h3><table><tr>${P.map(x=>`<th>${x[2]}</th>`).join('')}</tr>${ps.map(p=>`<tr>${P.map(x=>`<td>${esc(p[x[0]]||'—')}</td>`).join('')}</tr>`).join('')}</table>`;
$('pr1').onclick=()=>{if(!db[cur])return;const o=db[cur],a=age(cur),c=(l,v,cl)=>`<div class="c ${cl||''}"><small>${esc(l)}</small><b>${esc(v||'—')}</b></div>`;
const cells=F.filter(x=>!['notes','advisor','model'].includes(x[0])).map(x=>c(x[2],o[x[0]])+(x[0]==='date'?c('مدة الانتظار',ageTxt(cur),a&&a.c):'')).join('');
doPrint(`<div class="f"><div class="ph">${esc(show(cur))}</div><div class="sub">تقرير حالة السيارة · ${today()}</div><div class="k"><div class="c"><b>${esc(o.advisor||'—')}</b></div><div class="c"><b>${esc(o.model||'—')}</b></div></div>${oth(cur)?`<div class="c y" style="margin-bottom:8px">${esc(oth(cur))}</div>`:''}<div class="g">${cells}</div><div class="nb"><small>ملاحظات</small>${esc(o.notes||'—')}</div>${(o.parts||[]).length?ptab(o.parts):''}</div>`)};
$('wa1').onclick=()=>{if(!db[cur])return;const o=db[cur];let t=`🚗 *تقرير حالة سيارة*\n*رقم اللوحة:* ${show(cur)}\n*مهندس الاستقبال:* ${o.advisor||'—'}\n*موديل السيارة:* ${o.model||'—'}\n`+(oth(cur)?oth(cur)+'\n':'')+F.filter(x=>!['notes','advisor','model'].includes(x[0])).map(x=>`*${x[2]}:* ${o[x[0]]||'—'}`+(x[0]==='date'?`\n*مدة الانتظار:* ${ageTxt(cur)}`:'')).join('\n')+`\n*ملاحظات:* ${o.notes||'—'}`;
(o.parts||[]).forEach((p,i)=>{t+=`\n\n🔧 *قطعة ${i+1}*\n`+P.map(x=>`*${x[2]}:* ${p[x[0]]||'—'}`).join('\n')});share(t)};
$('wa2').onclick=()=>{if(!cap.length)return toast('الجرد فارغ');const f=cap.filter(c=>db[c.key]),n=cap.filter(c=>!db[c.key]);
let t=`🚗 *جرد العربيات* ${today()} (${cap.length})\n`;
f.forEach((c,i)=>{const o=db[c.key];t+=`\n${i+1}) *${show(c.key)}* | ${o.model||'—'} | ${o.incident||'—'} | ${o.status||'—'} | ${ageTxt(c.key)}`;
(o.parts||[]).forEach(p=>{t+=`\n   🔧 ${[p.item,p.ps,p.sod].filter(Boolean).join(' - ')}`})});
if(n.length)t+=`\n\n⚠️ *غير موجودة في الشيت:*\n`+n.map(c=>show(c.key)).join('\n');share(t)};
$('bp').onclick=()=>{if(!cap.length)return toast('الجرد فارغ');const f=cap.filter(c=>db[c.key]),n=cap.filter(c=>!db[c.key]),LIM=140;
const ct=s=>s.length>LIM?s.slice(0,LIM)+'…':s;
let h=`<h2>جرد العربيات · Inventory — ${today()} (${cap.length})</h2><table><tr><th>#</th><th>${PL[0]}</th>`+F.map(x=>`<th>${x[2]}${x[3]?'<br>'+x[3]:''}</th>`+(x[0]==='date'?'<th>مدة الانتظار</th>':'')).join('')+'<th>قطع الغيار</th></tr>';
f.forEach((c,i)=>{const o=db[c.key],a=age(c.key);h+=`<tr><td>${i+1}</td><td><b>${esc(show(c.key))}</b></td>`+F.map(([k])=>`<td>${esc(k==='notes'?ct(o[k]||''):o[k]||'')}</td>`+(k==='date'?`<td class="${a?a.c:''}">${esc(ageTxt(c.key))}</td>`:'')).join('')+`<td>${(o.parts||[]).map(p=>esc([p.item,p.ps,p.sod].filter(Boolean).join(' - '))).join('<br>')}</td></tr>`});
h+='</table>';
if(n.length)h+=`<h2 style="margin-top:14px">غير موجودة في الشيت · Not in sheet</h2><table>`+n.map(c=>`<tr><td>${esc(show(c.key))}</td></tr>`).join('')+'</table>';
const long=f.filter(c=>(db[c.key].notes||'').length>LIM);
if(long.length)h+=`<div class="pb"><h2>الملاحظات الكاملة · Full Notes</h2><table>`+long.map(c=>`<tr><td class="l">${esc(show(c.key))}</td><td>${esc(db[c.key].notes)}</td></tr>`).join('')+'</table></div>';
doPrint(h,1)};
// excel
$('bx').onclick=()=>{if(!cap.length)return toast('الجرد فارغ');const f=cap.filter(c=>db[c.key]);
const H=[PL[0]+' / '+PL[1],...F.flatMap(x=>{const h=x[3]?x[2]+' / '+x[3]:x[2];return x[0]==='date'?[h,'مدة الانتظار (يوم)','تنبيه']:[h]}),'قطع الغيار'];
const a=[H,...f.map(c=>{const o=db[c.key],g=age(c.key);return [show(c.key),...F.flatMap(([k])=>k==='date'?[o[k]||'',g?g.n:'',g?(g.n>30?'🔴 أكثر من 30 يوم':g.n>15?'🟡 أكثر من 15 يوم':''):'']:[o[k]||'']),(o.parts||[]).map(p=>[p.item,p.ps,p.sod].filter(Boolean).join(' - ')).join('\n')]})];
const ws=XLSX.utils.aoa_to_sheet(a);ws['!cols']=H.map(h=>({wch:h.startsWith('ملاحظات')?60:h==='قطع الغيار'?40:20}));
const n=cap.filter(c=>!db[c.key]).map(c=>[show(c.key)]);const w2=XLSX.utils.aoa_to_sheet([['غير موجودة في الشيت / Not in sheet'],...n]);w2['!cols']=[{wch:36}];
const wb=XLSX.utils.book_new();wb.Workbook={Views:[{RTL:true}]};XLSX.utils.book_append_sheet(wb,ws,'Inventory');XLSX.utils.book_append_sheet(wb,w2,'Not in sheet');
const pr=[];f.forEach(c=>(db[c.key].parts||[]).forEach(p=>pr.push([show(c.key),...P.map(x=>p[x[0]]||'')])));
if(pr.length){const w3=XLSX.utils.aoa_to_sheet([[PL[0],...P.map(x=>x[2])],...pr]);w3['!cols']=[{wch:16},...P.map(()=>({wch:22}))];XLSX.utils.book_append_sheet(wb,w3,'Parts')}
XLSX.writeFile(wb,'cars-inventory-'+new Date().toISOString().slice(0,10)+'.xlsx')};
$('bc').onclick=()=>{if(confirm('مسح كل الجرد؟ Clear all?')){cap=[];cur=null;put('cap',cap);render()}};
// init
(async()=>{db=(await get('db'))||{};cap=(await get('cap'))||[];if(Object.keys(db).length)info();render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
if(navigator.onLine)worker().then(()=>$('st').textContent='OCR ✔ offline-ready').catch(()=>{});else $('st').textContent='offline'})();
</script></body></html>
