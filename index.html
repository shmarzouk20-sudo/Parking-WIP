<style>

</style></head><body>
<header><span>🚗 جرد العربيات · Car Check</span><span id="st" class="small" style="color:#bfdbfe"></span></header>
<main>
<section><h3>1) الشيت · Sheet (xlsx / csv)</h3>

<button id="bx" class="ok">⬇️ Excel</button><button id="bp">🖨️ PDF</button><button id="wa2" class="ok">📲 واتساب</button><button id="bc" class="r">مسح الكل · Clear</button></section>
</main>
<style id="pg"></style><div id="pa"></div><div class="toast" id="t"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js" crossorigin="anonymous"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const F=[['incident','INCIDENT_NUMBER','رقم أمر الشغل','Work Order'],['date','RECEPTION_DATE','تاريخ الاستلام','Reception Date'],['model','MODEL','موديل السيارة','Model'],['vin','LOT_NUMBER','رقم الشاسيه','Chassis'],['km','COUNTER_READING','عداد الكيلومتر','Odometer'],['advisor','SERVICE_ADVISOR','مهندس الاستقبال','Service Advisor'],['leader','TEAM_LEADER','تيم ليدر','Team Leader'],['status','JOB_STATUS','حالة أمر الشغل','Job Status'],['notes','NOTES','ملاحظات','']];
const SHOWQ=false; // true = إظهار عدد القطع بالفرع والشركة
const PALL=[['item','ITEM_DESC','القطعة','Part'],['sod','SALES_ORDER_DATE','تاريخ طلب القطعة','Order Date'],['eta','ETA','تاريخ متوقع وصول القطعة','ETA'],['ps','PART_STATUS','حالة القطعة','Part Status'],['aq','AVAILABLE_QTY','المتاح بالفرع','Branch Qty',1],['oq','ORG_QTY','المتاح بالشركة','Company Qty',1],['sms','SMS_SENT','SMS_SENT',''],['smsd','SMS_DATE','SMS_DATE',''],['vor','VOR_FLAG_DATE','VOR_FLAG_DATE','']];
const P=PALL.filter(x=>SHOWQ||!x[4]),DT=new Set(['sod','eta','smsd','vor']);
const PL=['رقم اللوحة','Plate'];
let db={},cap=[],cur=null,nrec=[],vidx={},nidx=[],flt='';
// storage
const idb=new Promise((res,rej)=>{const r=indexedDB.open('cars',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>res(r.result);r.onerror=rej});
const put=async(k,v)=>{const d=await idb;d.transaction('k','readwrite').objectStore('k').put(v,k)};
const get=async k=>{const d=await idb;return new Promise(r=>{const q=d.transaction('k').objectStore('k').get(k);q.onsuccess=()=>r(q.result)})};
const toast=m=>{const t=$('t');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200)};
// plate helpers
const AD='٠١٢٣٤٥٦٧٨٩';
const norm=s=>String(s||'').replace(/[٠-٩]/g,d=>AD.indexOf(d)).replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[^0-9\u0621-\u064A]/g,'');
const show=k=>k[0]==='V'?(k[2]==='#'?'أمر شغل '+k.slice(3):'شاسيه '+k.slice(-6)):k.includes('#')?show(k.split('#')[0])+' · '+k.split('#')[1].slice(-6):k.replace(/\d/g,'').split('').join(' ')+' '+k.replace(/\D/g,'');
function lev(a,b){const m=[...Array(a.length+1)].map((_,i)=>[i]);for(let j=1;j<=b.length;j++)m[0][j]=j;
for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]==b[j-1]?0:1));return m[a.length][b.length]}
function cands(q,n){const qd=q.replace(/\D/g,''),ql=q.replace(/\d/g,'');
return Object.keys(db).filter(k=>k[0]!=='V').map(k=>{const b=k.split('#')[0];return {k,s:lev(qd,b.replace(/\D/g,''))*2+lev(ql,b.replace(/[0-9]/g,''))}}).sort((a,b)=>a.s-b.s).slice(0,n)}
// sheet
const hn=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const MO=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
function fd(s){s=String(s);let m=s.match(/^(\d{1,2})[-\s]([A-Za-z]{3})[a-z]*[-\s](\d{2,4})/);if(m){const mo=MO.indexOf(m[2].toLowerCase());if(mo<0)return s;let y=+m[3];if(y<100)y+=2000;return `${+m[1]}/${mo+1}/${y}`}
m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);return m?`${+m[1]}/${+m[2]}/${m[3]}`:s}
function readRows(wb){const seen=[];for(const n of wb.SheetNames){
const a=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false,defval:''});
for(let i=0;i<Math.min(a.length,30);i++){const h=a[i].map(hn),pi=h.findIndex(x=>x.startsWith('PLATE'));
if(pi>=0)return a.slice(i+1).map(r=>{const o={__p:r[pi]};h.forEach((k,j)=>{if(k&&!(k in o))o[k]=r[j]});return o});
if(i<2)seen.push(a[i].slice(0,6).join(','))}}
throw new Error('عمود PLATE_NUMBER غير موجود / not found. Saw: '+seen.join(' // '))}
const recOf=k=>db[k]||(k[0]==='V'?(nrec.find(z=>k[2]==='#'?z.c.incident===k.slice(3):vn(String(z.c.vin||'').split(' | ')[0])===k.slice(2))||{}).c:null);
const vn=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const nt=s=>String(s||'').replace(/[٠-٩]/g,d=>AD.indexOf(d)).replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه');
function mkRec(rs,plate){const c={plate,_s:{},_p:new Map(),others:[]};
for(const r of rs){
for(const [f,col] of F){let v=String(r[hn(col)]??'').trim();if(col==='SERVICE_ADVISOR')v=v.replace(/\s*\(.*?\)\s*/g,' ').trim();
if(f==='date')v=fd(v);if(v)(c._s[f]??=new Set()).add(v)}
const vor=fd(String(r.VORFLAGDATE??'').trim());
if(/\d/.test(vor)){const q={};for(const x of PALL){let v=String(r[hn(x[1])]??'').trim();if(DT.has(x[0]))v=fd(v);q[x[0]]=v}c._p.set(JSON.stringify(q),q)}}
for(const f in c._s)c[f]=f==='date'?[...c._s[f]][0]:f==='km'?[...c._s[f]].sort((a,b)=>(parseFloat(String(b).replace(/,/g,''))||0)-(parseFloat(String(a).replace(/,/g,''))||0))[0]:[...c._s[f]].join(' | ');c.parts=[...c._p.values()];delete c._s;delete c._p;return c}
function build(rows){const g={},ng={},vx={},nx=[];
for(const r of rows){const k=norm(r.__p),inc=String(r.INCIDENTNUMBER??'').trim(),vv=vn(r.LOTNUMBER);
if(vv&&!k&&!vx[vv])vx[vv]='V:'+vv;
{const nz=String(r.NOTES??'').toUpperCase().replace(/[^A-Z0-9]+/g,' ').trim();if(nz&&(k||inc)){const t=nz.split(' ').filter(x=>x.length>=8&&/[A-Z]/.test(x)).join(' '),c=nz.replace(/ /g,'');if(t||c.length>=14)nx.push({p:k,v:vv,inc,t,c:c.length>=14?c:''})}}
if(!k){if(/\d/.test(String(r.NOTES??''))||String(r.LOTNUMBER??'').trim())(ng[inc]??=[]).push(r);continue}
(((g[k]??={})[vv]??={})[inc]??=[]).push(r)}
const dv=r=>{const m=fd(String(r.RECEPTIONDATE??'').trim()).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);return m?(+m[3])*1e4+(+m[2])*100+(+m[1]):0};
const o={},multi={};
for(const [k,vs] of Object.entries(g)){const vk=Object.keys(vs).filter(x=>x),isM=vk.length>1;if(isM)multi[k]=1;
const groups=isM?Object.entries(vs).map(([v,incs])=>[k+'#'+(v||'NA'),incs,v]):[[k,Object.values(vs).reduce((m,incs)=>{for(const [i,rs] of Object.entries(incs))(m[i]??=[]).push(...rs);return m},{}),vk[0]||'']];
for(const [key,incs,v] of groups){const ids=Object.keys(incs);const kk=id=>{const n=id.replace(/\D/g,'');return [Math.max(...incs[id].map(dv)),n.length,n]};
const gt=(a,b)=>{for(let i=0;i<3;i++){if(a[i]!==b[i])return a[i]>b[i]}return true};
let best=ids[0];for(const id of ids)if(gt(kk(id),kk(best)))best=id;
const c=o[key]=mkRec(incs[best],String(incs[best][0].__p).trim());c.others=ids.filter(i=>i&&i!==best);
if(!c.km){for(const id of ids.filter(i=>i!==best).sort((a,b)=>gt(kk(a),kk(b))?-1:1)){const t=mkRec(incs[id],'');if(t.km){c.km=t.km;break}}}
if(v)vx[v]=key}}
nrec=Object.values(ng).map(rs=>{const c=mkRec(rs,'—');c.viaNotes=1;return {t:nt(rs.map(r=>r.NOTES).join(' ')),c,d:Math.max(...rs.map(dv))}});
vidx=vx;nidx=nx.map(e=>({k:e.p?(multi[e.p]?e.p+'#'+(e.v||'NA'):e.p):'V:#'+e.inc,t:e.t,c:e.c}));return o}
function findN(k){const L=k.replace(/\d/g,'').split(''),D=k.replace(/\D/g,'');if(!D||!L.length)return null;
const re=new RegExp('(^|[^\\u0621-\\u064A0-9])'+L.join('\\s*')+'\\s*'+D+'(?!\\d)');let b=null;
for(const x of nrec)if(re.test(x.t)&&(!b||x.d>=b.d))b=x;return b}
function matN(k){if(db[k])return true;if(k[0]==='V'){const vin=k.slice(2),y=nrec.find(z=>vin[0]==='#'?z.c.incident===vin.slice(1):vn(String(z.c.vin||'').split(' | ')[0])===vin);if(!y)return false;db[k]=Object.assign({},y.c,{plate:'—'});put('db',db);return true}if(k.includes('#'))return false;const x=findN(k);if(!x)return false;db[k]=Object.assign({},x.c,{plate:show(k)});put('db',db);return true}
$('f').onchange=async e=>{const file=e.target.files[0];if(!file)return;
try{const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
const rows=readRows(wb);if(rows.length&&!('COUNTERREADING' in rows[0]))alert('تنبيه: عمود COUNTER_READING غير موجود في الشيت · column missing');
db=build(rows);if(!Object.keys(db).length)return alert('لم أجد أي لوحات في الملف · No plates found');
await put('db',db);await put('nrec',nrec);await put('vidx',vidx);await put('nidx',nidx);info()}catch(x){alert('خطأ في قراءة الملف · '+x.message)}};
const info=()=>$('sinfo').textContent=`✔ ${Object.keys(db).length} سيارة / cars `;
// OCR
let wk;async function worker(){if(!wk){wk=await Tesseract.createWorker(['ara','eng']);await wk.setParameters({tessedit_pageseg_mode:'6'})}return wk}
let stream;
$('bcam').onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920}},audio:false});
$('v').srcObject=stream;await $('v').play()}catch(e){alert('تعذر تشغيل الكاميرا · Camera error: '+e.message)}};
$('bshot').onclick=async()=>{const v=$('v');if(!v.videoWidth)return toast('شغل الكاميرا أولا');
const sw=v.videoWidth*.8,sh=v.videoHeight*.3,c=document.createElement('canvas');c.width=900;c.height=Math.round(900*sh/sw);
const x=c.getContext('2d');x.drawImage(v,v.videoWidth*.1,v.videoHeight*.35,sw,sh,0,0,c.width,c.height);
const im=x.getImageData(0,0,c.width,c.height),d=im.data;
for(let i=0;i<d.length;i+=4){let g=.3*d[i]+.59*d[i+1]+.11*d[i+2];g=Math.max(0,Math.min(255,(g-128)*1.6+128));d[i]=d[i+1]=d[i+2]=g}
x.putImageData(im,0,0);$('ocr').textContent='⏳ جاري القراءة... Reading...';
try{const w=await worker();const r=await w.recognize(c);const k=norm(r.data.text);
$('ocr').textContent='قرأت · Read: '+(k?show(k):'—');$('q').value=k?show(k):'';suggest()}catch(e){$('ocr').textContent='OCR error: '+e.message}};
// manual
const kb=$('kb');'ا ب ج د ر س ص ط ع ف ق ك ل م ن ه و ي 1 2 3 4 5 6 7 8 9 0 ⌫'.split(' ').forEach(ch=>{const b=document.createElement('button');b.textContent=ch;
b.onclick=()=>{const q=$('q');q.value=ch==='⌫'?q.value.slice(0,-1):q.value+ch;suggest()};kb.appendChild(b)});
$('q').oninput=suggest;
function findV(cv){const m=Object.keys(vidx).length?vidx:(()=>{const o={};for(const [k,c] of Object.entries(db)){if(k[0]==='V')continue;const v=vn(String(c.vin||'').split(' | ')[0]);if(v&&!o[v])o[v]=k}
for(const x of nrec){const v=vn(String(x.c.vin||'').split(' | ')[0]);if(v&&!o[v])o[v]='V:'+v}return o})();
const sc=v=>cv.length>=17?(v===cv?0:9):v.endsWith(cv)?1:v.includes(cv)?2:9;
const rec=recOf;
let h=[];for(const [v,k] of Object.entries(m)){const s=sc(v);if(s<9){const c=rec(k);if(c)h.push({k,v,c,s})}}
if(!h.length){const seen=new Set();for(const e of nidx){const ok=cv.length>=17?(e.c.includes(cv)||e.t.includes(cv)):cv.length>=10?(e.c.includes(cv)||e.t.split(' ').some(t=>t.includes(cv))):e.t.split(' ').some(t=>t.endsWith(cv));
if(ok&&!seen.has(e.k)){seen.add(e.k);const c=recOf(e.k);if(c)h.push({k:e.k,v:cv,c,s:4})}}}
if(!h.length&&cv.length===17)h=Object.entries(m).map(([v,k])=>({k,v,c:rec(k),s:3+lev(cv,v)})).filter(x=>x.s<=6&&x.c).sort((a,b)=>a.s-b.s).slice(0,3);
const out=h.sort((a,b)=>a.s-b.s).slice(0,8);out.n=Object.keys(m).length;return out}
function suggestV(cv,box){const hs=findV(cv);
hs.forEach(({k,c,v})=>{const d=document.createElement('div');d.className='cand';
d.innerHTML=`<div><b>${esc(k[0]==='V'?'بدون لوحة':show(k))}</b><div class="small" dir="ltr">${esc(v||c.vin||'')}</div><div class="small">${esc(c.model||'')} · ${esc(c.incident||'')}</div></div>`;
const b=document.createElement('button');b.className='ok';b.textContent='✔ اختيار';b.onclick=()=>{matN(k);add(k,true)};d.appendChild(b);box.appendChild(d)});
if(!hs.length){const n=document.createElement('div');n.className='small';n.textContent='ℹ️ عدد الشاسيهات المقروءة من الشيت: '+hs.n+(hs.n?'':' — تأكد من وجود عمود LOT_NUMBER وارفع الشيت مرة أخرى');box.appendChild(n);const u=document.createElement('button');u.className='g';u.textContent=`➕ "${cv}" غير موجود في الشيت · not in sheet`;u.onclick=()=>add('V:'+cv,false);box.appendChild(u)}}
function prepC(c){const x=c.getContext('2d'),im=x.getImageData(0,0,c.width,c.height),d=im.data;
for(let i=0;i<d.length;i+=4){let g=.3*d[i]+.59*d[i+1]+.11*d[i+2];g=Math.max(0,Math.min(255,(g-128)*1.6+128));d[i]=d[i+1]=d[i+2]=g}x.putImageData(im,0,0)}
async function readVin(c,psm){$('ocr').textContent='⏳ جاري قراءة الشاسيه... Reading VIN...';
try{const w=await worker();await w.setParameters({tessedit_char_whitelist:'ABCDEFGHJKLMNPRSTUVWXYZ0123456789',tessedit_pageseg_mode:psm});
const r=await w.recognize(c);await w.setParameters({tessedit_char_whitelist:'',tessedit_pageseg_mode:'6'});
const toks=String(r.data.text||'').toUpperCase().split(/\s+/).map(t=>t.replace(/[^A-Z0-9]/g,'').replace(/[OQ]/g,'0').replace(/I/g,'1')).filter(Boolean),all=toks.join('');
const v=toks.find(t=>t.length===17)||(all.length>=17?all.slice(0,17):all);
$('ocr').textContent='قرأت · Read: '+(v||'—');$('q').value=v;suggest()}catch(e){$('ocr').textContent='OCR error: '+e.message}}
$('bvin').onclick=()=>{const v=$('v');if(!v.videoWidth)return toast('شغل الكاميرا أولا');const sw=v.videoWidth*.9,sh=v.videoHeight*.3,c=document.createElement('canvas');
